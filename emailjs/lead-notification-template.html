<!--
  EmailJS – hlavní šablona poptávky (lead) pro Autocash.
  Vložit do EmailJS → Email Templates → Content (bez tohoto komentáře).
  {{source}} z aplikace = veřejná URL webu, např. https://autocash.cz
-->
<div style="font-family: system-ui, sans-serif, Arial; font-size: 14px; color: #333333; max-width: 450px; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; background-color: #ffffff;">

    <div style="display: flex; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #0d3d32;">
        <div style="padding: 6px 10px; background-color: #ecfdf5; border-radius: 5px; font-size: 20px; line-height: 1;" role="img">
            <span style="color: #0d3d32;">🚗</span>
        </div>
        <div style="color: #0d3d32; font-size: 17px; font-weight: bold; margin-left: 10px;">
            AUTOCASH — NOVÁ POPTÁVKA
        </div>
    </div>

    <div style="padding: 10px 0;">
        <table role="presentation" style="width: 100%; border-collapse: collapse;">
            <tbody>
                <tr>
                    <td style="padding: 5px 0; width: 45%; vertical-align: top;"><strong>Zdroj:</strong></td>
                    <td style="padding: 5px 0; text-align: right;">{{source}}</td>
                </tr>
                <tr>
                    <td style="padding: 5px 0; width: 45%;"><strong>Jméno klienta:</strong></td>
                    <td style="padding: 5px 0; text-align: right;">{{name}}</td>
                </tr>
                <tr>
                    <td style="padding: 5px 0;"><strong>Telefon:</strong></td>
                    <td style="padding: 5px 0; text-align: right;"><a href="tel:{{phone}}" style="color: #0d3d32; text-decoration: none;">{{phoneDisplay}}</a></td>
                </tr>
                <tr>
                    <td style="padding: 5px 0;"><strong>E-mail:</strong></td>
                    <td style="padding: 5px 0; text-align: right;"><a href="mailto:{{email}}" style="color: #0d3d32; text-decoration: none;">{{email}}</a></td>
                </tr>
                <tr>
                    <td colspan="2" style="padding: 5px 0; border-top: 1px dashed #cccccc;"></td>
                </tr>
                <tr>
                    <td style="padding: 5px 0;"><strong>Typ zajištění:</strong></td>
                    <td style="padding: 5px 0; text-align: right;">{{propertyType}}</td>
                </tr>
                <tr>
                    <td style="padding: 5px 0; vertical-align: top;"><strong>Detail / služba:</strong></td>
                    <td style="padding: 5px 0; text-align: right;">{{serviceType}}</td>
                </tr>
                <tr>
                    <td style="padding: 12px 0 5px 0;"><strong>Požadovaná částka:</strong></td>
                    <td style="padding: 12px 0 5px 0; text-align: right; font-size: 18px; font-weight: bold; color: #0d3d32;">{{amount}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
